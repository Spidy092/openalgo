name: Consolidation surgical fix

on:
  push:
    paths:
      - ".github/workflows/consolidation-surgical-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/branch-consolidation-final-v1
      - name: Fix Stage-B planner compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/equity_engine/src/equity_engine/pit_historical_acquisition.py')
          text = p.read_text()
          old = '        interval_minutes=interval_minutes,\n        resolution="minutes",\n'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 legacy resolution arguments, found {count}')
          p.write_text(text.replace(old, '        interval_minutes=interval_minutes,\n'))
          PY
          python -m compileall -q research/equity_engine/src
      - name: Commit patch
        run: |
          git config user.name "openalgo-consolidation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/equity_engine/src/equity_engine/pit_historical_acquisition.py
          git commit -m "Fix Stage-B historical planner API compatibility"
          git push origin HEAD:codex/branch-consolidation-final-v1
