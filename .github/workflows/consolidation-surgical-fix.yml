name: Consolidation surgical fix

on:
  push:
    paths:
      - ".github/workflows/consolidation-surgical-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/branch-consolidation-final-v1
      - name: Reconcile Experiment and shadow compatibility contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Preserve legacy *omitted* CA scope for research identity, but reject an explicitly
          # empty scoped population. Integrity/promotion remain trusted-ledger-only.
          p = Path('research/equity_engine/src/equity_engine/experiment.py')
          text = p.read_text()
          marker = '@dataclass(frozen=True)\nclass CorporateActionEvidenceIdentity:'
          if '_UNSET_COVERED_INSTRUMENTS = object()' not in text:
              text = text.replace(marker, '_UNSET_COVERED_INSTRUMENTS = object()\n\n\n' + marker, 1)
          old = '    covered_instruments: tuple[str, ...] = ()\n'
          new = '    covered_instruments: tuple[str, ...] | object = _UNSET_COVERED_INSTRUMENTS\n'
          if old not in text:
              raise SystemExit('CorporateActionEvidenceIdentity field marker not found')
          text = text.replace(old, new, 1)
          old = '''        if not self.evidence_fingerprint.strip():
            raise ValueError("corporate-action evidence fingerprint is required")
        if any(not str(key).strip() for key in self.covered_instruments):
'''
          new = '''        if not self.evidence_fingerprint.strip():
            raise ValueError("corporate-action evidence fingerprint is required")
        if self.covered_instruments is _UNSET_COVERED_INSTRUMENTS:
            object.__setattr__(self, "covered_instruments", ())
        elif not self.covered_instruments:
            raise ValueError("covered_instruments cannot be empty for corporate-action evidence")
        if any(not str(key).strip() for key in self.covered_instruments):
'''
          if old not in text:
              raise SystemExit('CorporateActionEvidenceIdentity validation marker not found')
          text = text.replace(old, new, 1)

          # Promotion validation must report all promotion failures (including historical-cost
          # evidence) instead of masking them behind the CA trust check. The CA check remains a
          # required violation inside evaluate_promotion_gate.
          old = '''        policy = (
            trusted_corporate_action_policy
            if trusted_corporate_action_policy is not None
            else corporate_action_policy
        )
        if ledger is None:
'''
          new = '''        policy = (
            trusted_corporate_action_policy
            if trusted_corporate_action_policy is not None
            else corporate_action_policy
        )
        if promotion_thresholds is not None:
            passed, violations = self.evaluate_promotion_gate(
                promotion_thresholds,
                trusted_corporate_action_ledger=ledger,
                trusted_corporate_action_policy=policy,
                **kwargs,
            )
            if not passed:
                raise MissingEvidenceError(
                    "experiment failed promotion gate criteria: " + "; ".join(violations)
                )
            return
        if ledger is None:
'''
          # replace only in validate_integrity: use the last occurrence
          idx = text.rfind(old)
          if idx < 0:
              raise SystemExit('validate_integrity policy marker not found')
          text = text[:idx] + text[idx:].replace(old, new, 1)
          p.write_text(text)

          # 2) Offline DRY_RUN + SyntheticQuoteSource gets an explicitly synthetic readiness
          # report. LIVE_READ_ONLY still fails closed when readiness evidence is absent.
          p = Path('research/equity_engine/src/equity_engine/shadow_live_runner.py')
          text = p.read_text()
          old = '''    ReadinessClassification,
    build_runner_readiness_context,
)'''
          new = '''    ReadinessClassification,
    build_runner_readiness_context,
    build_synthetic_readiness_report,
)'''
          if old not in text:
              raise SystemExit('shadow readiness import marker not found')
          text = text.replace(old, new, 1)
          old = '''        report = self._readiness_report
        if not isinstance(report, LiveMarketReadinessReport):
            raise ReadinessGateError(READINESS_REPORT_MISSING)
'''
          new = '''        report = self._readiness_report
        if not isinstance(report, LiveMarketReadinessReport):
            if (
                self._config.mode is RunnerMode.DRY_RUN
                and isinstance(self._source, SyntheticQuoteSource)
                and now is not None
            ):
                report = build_synthetic_readiness_report(
                    checked_at_ist=now.astimezone(ZoneInfo(REQUIRED_TIMEZONE)),
                    trade_date=self._session_day,
                    instrument_keys=self._config.instrument_keys,
                    cas_eligible_by_key=self._config.cas_eligible_by_key,
                    tick_size_by_key=self._config.tick_size_by_key,
                    exit_buffer_minutes=self._config.exit_buffer_minutes,
                    approved_capital=self._config.approved_capital(),
                    quote_freshness_threshold_seconds=self._config.quote_freshness_threshold_seconds,
                    classification=ReadinessClassification.READY_FOR_RESEARCH_SHADOW,
                )
                self._readiness_report = report
            else:
                raise ReadinessGateError(READINESS_REPORT_MISSING)
'''
          if old not in text:
              raise SystemExit('shadow readiness gate marker not found')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # 3) Reconcile the older corporate-action test fixture with the hardened cost-evidence
          # constructor. No private verification bypass: derive identity from the real ledger.
          p = Path('research/equity_engine/tests/test_corporate_actions.py')
          text = p.read_text()
          if 'from equity_engine.cost_ledger import EffectiveDatedCostLedger, LedgerProduct\n' not in text:
              text = text.replace(
                  'import pytest\n',
                  'import pytest\nfrom equity_engine.cost_ledger import EffectiveDatedCostLedger, LedgerProduct\n',
                  1,
              )
          start = text.index('        cost_evidence_identity=CostEvidenceIdentity(\n')
          end_marker = '        cost_evidence_class="HISTORICAL_ACTUAL_COSTS",\n'
          end = text.index(end_marker, start)
          replacement = '''        cost_evidence_identity=CostEvidenceIdentity.from_ledger(
            EffectiveDatedCostLedger(),
            on_date=date(2026, 6, 30),
            product=LedgerProduct.INTRADAY,
        ),
'''
          text = text[:start] + replacement + text[end:]
          p.write_text(text)

          # 4) The end-to-end readiness test intentionally uses unscoped synthetic CA metadata.
          # It may validate research structure, but trusted integrity must not be asserted without
          # a PIT CA ledger.
          p = Path('research/equity_engine/tests/test_research_execution_readiness.py')
          text = p.read_text()
          old = '    experiment.validate_integrity()\n\n    # 11. Promotion Gate\n'
          new = '    experiment.validate_structure()\n\n    # 11. Promotion Gate\n'
          if old not in text:
              raise SystemExit('research execution integrity marker not found')
          p.write_text(text.replace(old, new, 1))
          PY
          python -m compileall -q research/equity_engine/src research/equity_engine/tests
      - name: Commit reconciliation
        run: |
          git config user.name "openalgo-consolidation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/equity_engine/src/equity_engine/experiment.py \
                  research/equity_engine/src/equity_engine/shadow_live_runner.py \
                  research/equity_engine/tests/test_corporate_actions.py \
                  research/equity_engine/tests/test_research_execution_readiness.py
          git commit -m "Reconcile Experiment trust and synthetic shadow readiness"
          git push origin HEAD:codex/branch-consolidation-final-v1
