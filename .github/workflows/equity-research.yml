name: Equity Research

on:
  push:
    paths:
      - "research/equity_engine/**"
      - ".github/workflows/equity-research.yml"
  pull_request:
    paths:
      - "research/equity_engine/**"
      - ".github/workflows/equity-research.yml"

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.ref == 'refs/heads/codex/branch-consolidation-final-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: codex/branch-consolidation-final-v1

      - name: Canonicalize Experiment and final compatibility seams
        run: |
          python research/equity_engine/scripts/canonicalize_experiment.py
          python -m compileall -q research/equity_engine/src research/equity_engine/tests
          test ! -e research/equity_engine/src/equity_engine/_experiment_v3_core.py
          test ! -e .github/workflows/consolidation-surgical-fix.yml
          test ! -e research/equity_engine/scripts/consolidation_reconcile.py
          test ! -e research/equity_engine/scripts/canonicalize_experiment.py
          ! grep -R "_experiment_v3_core" research/equity_engine/src/equity_engine

      - name: Commit canonical implementation
        run: |
          git config user.name "openalgo-consolidation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Canonicalize Experiment V3 and finalize evidence integration"
          git push origin HEAD:codex/branch-consolidation-final-v1
