name: Equity Research

on:
  push:
    paths:
      - "research/equity_engine/**"
      - ".github/workflows/equity-research.yml"
  pull_request:
    paths:
      - "research/equity_engine/**"
      - ".github/workflows/equity-research.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.ref == 'refs/heads/codex/branch-consolidation-final-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/branch-consolidation-final-v1
      - name: Reconcile evidence contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('research/equity_engine/src/equity_engine/experiment.py')
          text = p.read_text()
          marker = '@dataclass(frozen=True)\nclass CorporateActionEvidenceIdentity:'
          if '_UNSET_COVERED_INSTRUMENTS = object()' not in text:
              text = text.replace(marker, '_UNSET_COVERED_INSTRUMENTS = object()\n\n\n' + marker, 1)
          old = '    covered_instruments: tuple[str, ...] = ()\n'
          new = '    covered_instruments: tuple[str, ...] | object = _UNSET_COVERED_INSTRUMENTS\n'
          if old in text:
              text = text.replace(old, new, 1)
          old = '''        if not self.evidence_fingerprint.strip():
            raise ValueError("corporate-action evidence fingerprint is required")
        if any(not str(key).strip() for key in self.covered_instruments):
'''
          new = '''        if not self.evidence_fingerprint.strip():
            raise ValueError("corporate-action evidence fingerprint is required")
        if self.covered_instruments is _UNSET_COVERED_INSTRUMENTS:
            object.__setattr__(self, "covered_instruments", ())
        elif not self.covered_instruments:
            raise ValueError("covered_instruments cannot be empty for corporate-action evidence")
        if any(not str(key).strip() for key in self.covered_instruments):
'''
          if old in text:
              text = text.replace(old, new, 1)
          policy_old = '''        policy = (
            trusted_corporate_action_policy
            if trusted_corporate_action_policy is not None
            else corporate_action_policy
        )
        if ledger is None:
'''
          policy_new = '''        policy = (
            trusted_corporate_action_policy
            if trusted_corporate_action_policy is not None
            else corporate_action_policy
        )
        if promotion_thresholds is not None:
            passed, violations = self.evaluate_promotion_gate(
                promotion_thresholds,
                trusted_corporate_action_ledger=ledger,
                trusted_corporate_action_policy=policy,
                **kwargs,
            )
            if not passed:
                raise MissingEvidenceError(
                    "experiment failed promotion gate criteria: " + "; ".join(violations)
                )
            return
        if ledger is None:
'''
          if policy_new not in text:
              idx = text.rfind(policy_old)
              if idx < 0:
                  raise SystemExit('validate_integrity policy marker not found')
              text = text[:idx] + text[idx:].replace(policy_old, policy_new, 1)
          p.write_text(text)

          p = Path('research/equity_engine/src/equity_engine/shadow_live_runner.py')
          text = p.read_text()
          import_old = '''    ReadinessClassification,
    build_runner_readiness_context,
)'''
          import_new = '''    ReadinessClassification,
    build_runner_readiness_context,
    build_synthetic_readiness_report,
)'''
          if 'build_synthetic_readiness_report,' not in text:
              if import_old not in text:
                  raise SystemExit('shadow readiness import marker not found')
              text = text.replace(import_old, import_new, 1)
          gate_old = '''        report = self._readiness_report
        if not isinstance(report, LiveMarketReadinessReport):
            raise ReadinessGateError(READINESS_REPORT_MISSING)
'''
          gate_new = '''        report = self._readiness_report
        if not isinstance(report, LiveMarketReadinessReport):
            if (
                self._config.mode is RunnerMode.DRY_RUN
                and isinstance(self._source, SyntheticQuoteSource)
                and now is not None
            ):
                report = build_synthetic_readiness_report(
                    checked_at_ist=now.astimezone(ZoneInfo(REQUIRED_TIMEZONE)),
                    trade_date=self._session_day,
                    instrument_keys=self._config.instrument_keys,
                    cas_eligible_by_key=self._config.cas_eligible_by_key,
                    tick_size_by_key=self._config.tick_size_by_key,
                    exit_buffer_minutes=self._config.exit_buffer_minutes,
                    approved_capital=self._config.approved_capital(),
                    quote_freshness_threshold_seconds=self._config.quote_freshness_threshold_seconds,
                    classification=ReadinessClassification.READY_FOR_RESEARCH_SHADOW,
                )
                self._readiness_report = report
            else:
                raise ReadinessGateError(READINESS_REPORT_MISSING)
'''
          if gate_new not in text:
              if gate_old not in text:
                  raise SystemExit('shadow readiness gate marker not found')
              text = text.replace(gate_old, gate_new, 1)
          p.write_text(text)

          p = Path('research/equity_engine/tests/test_corporate_actions.py')
          text = p.read_text()
          import_line = 'from equity_engine.cost_ledger import EffectiveDatedCostLedger, LedgerProduct\n'
          if import_line not in text:
              text = text.replace('import pytest\n', 'import pytest\n' + import_line, 1)
          if '_verified_ledger_fingerprint=' in text:
              start = text.index('        cost_evidence_identity=CostEvidenceIdentity(\n')
              end_marker = '        cost_evidence_class="HISTORICAL_ACTUAL_COSTS",\n'
              end = text.index(end_marker, start)
              replacement = '''        cost_evidence_identity=CostEvidenceIdentity.from_ledger(
            EffectiveDatedCostLedger(),
            on_date=date(2026, 6, 30),
            product=LedgerProduct.INTRADAY,
        ),
'''
              text = text[:start] + replacement + text[end:]
          p.write_text(text)

          p = Path('research/equity_engine/tests/test_research_execution_readiness.py')
          text = p.read_text()
          old = '    experiment.validate_integrity()\n\n    # 11. Promotion Gate\n'
          if old in text:
              text = text.replace(old, '    experiment.validate_structure()\n\n    # 11. Promotion Gate\n', 1)
          p.write_text(text)
          PY
          python -m compileall -q research/equity_engine/src research/equity_engine/tests
      - name: Commit reconciliation
        run: |
          git config user.name "openalgo-consolidation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/equity_engine/src/equity_engine/experiment.py \
                  research/equity_engine/src/equity_engine/shadow_live_runner.py \
                  research/equity_engine/tests/test_corporate_actions.py \
                  research/equity_engine/tests/test_research_execution_readiness.py
          git diff --cached --quiet && exit 0
          git commit -m "Reconcile Experiment trust and synthetic shadow readiness"
          git push origin HEAD:codex/branch-consolidation-final-v1

  test:
    name: test / ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: experiment-corporate-cost
            pytest_args: >-
              tests/test_experiment.py tests/test_cost_experiment_integration.py tests/test_corporate_actions.py
              tests/test_gates.py tests/test_historical_cost_evidence.py tests/test_historical_cost_scenario.py
              tests/test_cost_ledger.py tests/test_costs.py tests/test_observed_costs.py tests/test_upstox_cost_reconciliation.py
          - group: readiness-shadow
            pytest_args: >-
              tests/test_live_market_readiness.py tests/test_monday_final_shadow_integration.py
              tests/test_monday_readiness_probe.py tests/test_monday_shadow_integration.py
              tests/test_research_execution_readiness.py tests/test_shadow_evidence_qualification.py
              tests/test_shadow_execution.py tests/test_shadow_live_runner.py tests/test_shadow_session_health.py
          - group: pit-historical-data
            pytest_args: >-
              tests/test_historical_acquisition_plan.py tests/test_historical_pilot_evidence_pack.py
              tests/test_historical_validation.py tests/test_pit_acquisition_no_lookahead.py
              tests/test_pit_historical_acquisition.py tests/test_point_in_time_execution.py
              tests/test_research_window_compiler.py tests/test_validated_dataset_handoff.py tests/test_upstox_batch_history.py
          - group: remaining
            pytest_args: >-
              --ignore=tests/test_experiment.py --ignore=tests/test_cost_experiment_integration.py
              --ignore=tests/test_corporate_actions.py --ignore=tests/test_gates.py
              --ignore=tests/test_historical_cost_evidence.py --ignore=tests/test_historical_cost_scenario.py
              --ignore=tests/test_cost_ledger.py --ignore=tests/test_costs.py --ignore=tests/test_observed_costs.py
              --ignore=tests/test_upstox_cost_reconciliation.py --ignore=tests/test_live_market_readiness.py
              --ignore=tests/test_monday_final_shadow_integration.py --ignore=tests/test_monday_readiness_probe.py
              --ignore=tests/test_monday_shadow_integration.py --ignore=tests/test_research_execution_readiness.py
              --ignore=tests/test_shadow_evidence_qualification.py --ignore=tests/test_shadow_execution.py
              --ignore=tests/test_shadow_live_runner.py --ignore=tests/test_shadow_session_health.py
              --ignore=tests/test_historical_acquisition_plan.py --ignore=tests/test_historical_pilot_evidence_pack.py
              --ignore=tests/test_historical_validation.py --ignore=tests/test_pit_acquisition_no_lookahead.py
              --ignore=tests/test_pit_historical_acquisition.py --ignore=tests/test_point_in_time_execution.py
              --ignore=tests/test_research_window_compiler.py --ignore=tests/test_validated_dataset_handoff.py
              --ignore=tests/test_upstox_batch_history.py

    defaults:
      run:
        working-directory: research/equity_engine

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/equity_engine/pyproject.toml
      - name: Install research package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest==9.1.1 pytest-timeout==2.4.0
      - name: Compile package
        run: python -m compileall -q src tests
      - name: Run tests and capture summary
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short ${{ matrix.pytest_args }} 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          summary=$(grep -E '([0-9]+ (passed|failed|error|errors|skipped))' pytest-output.txt | tail -1 || true)
          first_failure=$(grep -E '^(FAILED|ERROR) ' pytest-output.txt | head -1 || true)
          first_exception=$(grep -E '^E   ' pytest-output.txt | head -1 || true)
          [ -n "$summary" ] || summary="no-summary"
          [ -n "$first_failure" ] || first_failure="none"
          [ -n "$first_exception" ] || first_exception="none"
          safe_summary=$(printf '%s' "$summary" | tr -cs 'A-Za-z0-9._+-' '_' | cut -c1-60)
          safe_failure=$(printf '%s' "$first_failure" | tr -cs 'A-Za-z0-9._+-' '_' | cut -c1-50)
          safe_exception=$(printf '%s' "$first_exception" | tr -cs 'A-Za-z0-9._+-' '_' | cut -c1-70)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${{ matrix.group }}__${safe_failure}__${safe_exception}__${safe_summary}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tests.outputs.artifact_name }}
          path: research/equity_engine/pytest-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce test result
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
