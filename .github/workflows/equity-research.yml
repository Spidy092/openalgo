name: Equity Research

on:
  push:
    paths:
      - "research/equity_engine/**"
      - ".github/workflows/equity-research.yml"
  pull_request:
    paths:
      - "research/equity_engine/**"
      - ".github/workflows/equity-research.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/equity_engine

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/equity_engine/pyproject.toml

      - name: Install research package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest==9.1.1 pytest-timeout==2.4.0

      - name: Compile package
        run: python -m compileall -q src tests

      - name: Run full test suite
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          summary=$(grep -E '([0-9]+ (passed|failed|error|errors|skipped))' pytest-output.txt | tail -1 || true)
          [ -n "$summary" ] || summary="no-summary"
          safe_summary=$(printf '%s' "$summary" | tr -cs 'A-Za-z0-9._+-' '_' | cut -c1-100)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "artifact_name=full-suite__${safe_summary}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish full-suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tests.outputs.artifact_name }}
          path: research/equity_engine/pytest-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce test result
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
