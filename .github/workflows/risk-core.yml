name: Risk Core

on:
  push:
    paths:
      - "services/risk/**"
      - "test/risk/**"
      - ".github/workflows/risk-core.yml"
  pull_request:
    paths:
      - "services/risk/**"
      - "test/risk/**"
      - ".github/workflows/risk-core.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Compile risk core
        run: python -m compileall -q services/risk test/risk

      - name: Run risk core tests
        run: python -m pytest -q --confcutdir=test/risk test/risk/
